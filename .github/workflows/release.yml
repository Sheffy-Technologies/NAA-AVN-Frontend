name: Release

# Triggers when you push a tag like v0.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

jobs:
  publish-tauri:
    permissions:
      contents: write   # needed to create a GitHub Release

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"      # Apple Silicon
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"       # Intel Mac
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Required on Linux only
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # BRIDGE RELEASE MODE: publishing to THIS repo (temporarily public) so
      # already-installed apps -- which still have the old endpoint pointing
      # here baked in -- can find this release and self-update. Its
      # tauri.conf.json already points at the new permanent endpoint
      # (NAA-AVN-Frontend-releases), so once installed, the app checks that
      # repo from then on. After this bridge release has had time to reach
      # existing installs, switch this step back to publishing at
      # NAA-AVN-Frontend-releases (owner/repo/releaseCommitish inputs +
      # RELEASES_REPO_TOKEN) and re-privatize this repo.
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "AVN ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download this version. The desktop app will auto-update from `latest.json`."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
